[entity-name]
ghost-scanner-ia=Ghost Scanner (Ignore Assigned)

[entity-description]
ghost-scanner-ia=Outputs circuit network signals for construction ghosts within the same logistic network. Variant that can ignore ghosts which already have a construction robot dispatched (see mod settings).

[item-name]
ghost-scanner-ia=Ghost Scanner (Ignore Assigned)

[mod-setting-name]
ghost-scanner-ia-scan-areas-per-tick=Scanned areas per tick
ghost-scanner-ia-update-interval=Logistics network update interval (ticks)
ghost-scanner-ia-max-results=Scan Result limit
ghost-scanner-ia-show-hidden=Show hidden items
ghost-scanner-ia-negative-output=Invert output
ghost-scanner-ia-round2stack=Round to stacks
ghost-scanner-ia-area-scan-delay=Area scan update interval (ticks)
ghost-scanner-ia-ignore-assigned-ghosts=Ignore assigned ghosts

[mod-setting-description]
ghost-scanner-ia-scan-areas-per-tick=how many logistic network cells are scanned on each tick\nLower numbers greatly improve performance.\nDefault=5
ghost-scanner-ia-update-interval=Minimum time between ticks when Ghost Scanners are looked at for logistic network updates.\nIf number of scanners is larger than this value, then time is doubled\nDefault = 180
ghost-scanner-ia-max-results=Limits ghosts found per Ghost Scanner. Modules are not counted individually.\nLower numbers greatly improve performance.\nSet to 0 to remove limit.\nDefault = 1000
ghost-scanner-ia-show-hidden=Enable to show hidden items e.g. LTN input/output.
ghost-scanner-ia-negative-output=Output as negative numbers for use as LTN requests.
ghost-scanner-ia-round2stack=Rounds item counts up (down with Invert output) to next full item stack.
ghost-scanner-ia-area-scan-delay=Minimum time between ticks that scans for ghost-like entities are performed.
ghost-scanner-ia-ignore-assigned-ghosts=If enabled, ghosts with an already dispatched construction robot are ignored.\nThis prevents double-requesting items while construction bots are already on their way.\nApplies to entity ghosts, tile ghosts, upgrades and module (item-request) ghosts.\nDefault = off
